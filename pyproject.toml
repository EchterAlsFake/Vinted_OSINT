[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/Vinted_OSINT.py"]
include = ["src/Vinted_OSINT.py"]


[project]
name = "Vinted_OSINT"
version = "1.3.0"
description = "An OSINT tool for Vinted.com"
requires-python = ">=3.12"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Johannes Habel", email = "EchterAlsFake@proton.me" }
]

classifiers = [
    "Programming Language :: Python",
]
dependencies = [
    "eaf_base_api>=4.2.0,<5",
    "colorama",
    "prettytable",
    "rich>=15.0.0",
    "rich-argparse>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/EchterAlsFake/Vinted_OSINT"

[project.scripts]
Vinted_OSINT = "Vinted_OSINT:main"


[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: requires network access to Vinted"]
